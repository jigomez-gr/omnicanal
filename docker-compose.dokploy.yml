# Stack de Dokploy para el CRM de Soniquete Flamenco (omnicanal)
# Dominio: https://crm.soniqueteconarte.jigretera.com (Servicio: web, Puerto: 3000)
# Base de datos: PostgreSQL nativa en el sistema de archivos del servidor (puerto 5433, no en Docker).
# Comparte el volumen multimedia /var/data/soniqueteflamenco/media con la Landing sin duplicar ficheros en Git.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-W39xlpS9}@host.docker.internal:5433/${POSTGRES_DB:-evolution_soniquete}}
      APP_URL: ${APP_URL:-https://crm.soniqueteconarte.jigretera.com}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://crm.soniqueteconarte.jigretera.com}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      CRON_SECRET: ${CRON_SECRET}
      SETUP_TOKEN: ${SETUP_TOKEN}
      DEMO_MODE: ${DEMO_MODE:-false}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      MEDIA_STORAGE_ROOT: ${MEDIA_STORAGE_ROOT:-/var/data/soniqueteflamenco/media}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-https://evolutionapisoniqueteflamenco.jigretera.com}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME:-soniqueteflamenco}
    volumes:
      - /var/data/soniqueteflamenco/media:/var/data/soniqueteflamenco/media:rw
    networks:
      - dokploy-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node_modules/.bin/tsx", "--conditions=react-server", "scripts/worker.ts"]
    restart: unless-stopped
    depends_on:
      - web
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-W39xlpS9}@host.docker.internal:5433/${POSTGRES_DB:-evolution_soniquete}}
      APP_URL: ${APP_URL:-https://crm.soniqueteconarte.jigretera.com}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://crm.soniqueteconarte.jigretera.com}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      CRON_SECRET: ${CRON_SECRET}
      SETUP_TOKEN: ${SETUP_TOKEN}
      DEMO_MODE: ${DEMO_MODE:-false}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      EMAIL_IMAP_IDLE: ${EMAIL_IMAP_IDLE:-true}
      MEDIA_STORAGE_ROOT: ${MEDIA_STORAGE_ROOT:-/var/data/soniqueteflamenco/media}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-https://evolutionapisoniqueteflamenco.jigretera.com}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME:-soniqueteflamenco}
    volumes:
      - /var/data/soniqueteflamenco/media:/var/data/soniqueteflamenco/media:rw
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
